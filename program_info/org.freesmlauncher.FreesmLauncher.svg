<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6cff"/>
      <stop offset="1" stop-color="#4a2fc2"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <!-- soft shadow under the block -->
  <ellipse cx="128" cy="214" rx="70" ry="12" fill="#1b0f4a" fill-opacity="0.35"/>
  <!-- left and right dirt faces -->
  <polygon points="52,92 128,136 128,214 52,170" fill="#7a4e2c"/>
  <polygon points="128,136 204,92 204,170 128,214" fill="#5e3b21"/>
  <!-- dirt speckles -->
  <polygon points="66,140 80,148 80,160 66,152" fill="#5e3b21"/>
  <polygon points="96,170 110,178 110,190 96,182" fill="#5e3b21"/>
  <polygon points="150,168 164,160 164,172 150,180" fill="#4a2e19"/>
  <polygon points="180,132 194,124 194,136 180,144" fill="#4a2e19"/>
  <!-- grass overhang on the side faces -->
  <polygon points="52,92 128,136 128,156 52,112" fill="#4caf1f"/>
  <polygon points="128,136 204,92 204,112 128,156" fill="#3d8f18"/>
  <polygon points="66,120 80,128 80,140 66,132" fill="#4caf1f"/>
  <polygon points="170,118 184,110 184,122 170,130" fill="#3d8f18"/>
  <!-- grass top -->
  <polygon points="128,48 204,92 128,136 52,92" fill="#6fd13a"/>
  <polygon points="128,64 150,77 128,90 106,77" fill="#5cc22a"/>
  <polygon points="90,92 104,100 90,108 76,100" fill="#5cc22a"/>
  <polygon points="160,98 174,106 160,114 146,106" fill="#5cc22a"/>
  <!-- light edge -->
  <polyline points="52,92 128,48 204,92" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
</svg>
